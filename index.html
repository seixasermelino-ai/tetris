<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qual é a Nota? - Word Puzzle</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #stats-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
        }

        #level-progress-bar {
            grid-column: span 3;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }

        #level-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            transition: width 0.3s ease;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 10px 0;
        }

        .cell {
            aspect-ratio: 1;
            border: 2px solid #334155;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            background: rgba(30, 41, 59, 0.5);
            transition: all 0.2s ease;
            user-select: none;
        }

        .cell.active {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .cell.correct {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        .cell.present {
            background-color: var(--warning);
            border-color: var(--warning);
            color: white;
        }

        .cell.absent {
            background-color: #334155;
            border-color: #334155;
            color: var(--text-muted);
        }

        #keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            margin-top: 5px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        .key {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: 4px;
            background: #334155;
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
            text-transform: uppercase;
        }

        .key:active {
            background: #475569;
            transform: scale(0.95);
        }

        .key.wide {
            flex: 1.5;
            font-size: 0.8rem;
        }

        .key.correct { background-color: var(--success); }
        .key.present { background-color: var(--warning); }
        .key.absent { background-color: #1e293b; color: #475569; }

        #message-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--primary);
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        #message-overlay.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-height: 700px) {
            h1 { font-size: 1.4rem; }
            #game-container { gap: 8px; padding: 10px; }
            .cell { font-size: 1.4rem; }
            .key { height: 40px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Qual é a Nota?</h1>
        <div class="subtitle">Evolua sua pontuação e destrua as linhas</div>
    </header>

    <div id="message-overlay">Mensagem</div>

    <div id="game-container">
        <div id="stats-panel">
            <div class="stat-box">
                <span class="stat-label">Pontos</span>
                <span id="score-val" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Linhas</span>
                <span id="lines-val" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Nível</span>
                <span id="level-val" class="stat-value">1</span>
            </div>
            <div id="level-progress-bar">
                <div id="level-progress-fill"></div>
            </div>
        </div>

        <div id="board"></div>

        <div id="keyboard"></div>
    </div>

    <script>
        // Configurações do Jogo e Limites de Níveis Atualizados
        const CONFIG = {
            COLS: 5,
            ROWS: 6,
            LEVELS: [
                { score: 0, lines: 0, name: "Iniciante" },
                { score: 75000, lines: 35, name: "Bronze" },
                { score: 150000, lines: 70, name: "Prata" },
                { score: 225000, lines: 105, name: "Ouro" },
                { score: 300000, lines: 140, name: "Mestre" }
            ]
        };

        // Estado do Jogo
        let gameState = {
            score: 0,
            lines: 0,
            currentLevel: 1,
            currentRow: 0,
            currentCol: 0,
            secretWord: "TERRA", 
            boardState: [],
            isGameOver: false
        };

        // Lista simulada de palavras para validação interna simples
        const WORD_POOL = ["TERRA", "PUDIM", "CHAVE", "PORTA", "TREM", "FOGO", "ANEL", "LIVRO", "MAPA", "VERDE"];

        // Inicialização
        function initGame() {
            gameState.boardState = Array(CONFIG.ROWS).fill().map(() => Array(CONFIG.COLS).fill(''));
            gameState.secretWord = WORD_POOL[Math.floor(Math.random() * WORD_POOL.length)];
            
            buildBoard();
            buildKeyboard();
            updateUI();
        }

        function buildBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            for (let r = 0; r < CONFIG.ROWS; r++) {
                for (let c = 0; c < CONFIG.COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${r}-${c}`;
                    board.appendChild(cell);
                }
            }
            highlightCurrentCell();
        }

        function buildKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';
            
            const rows = [
                ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
                ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'Ç'],
                ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'BACKSPACE']
            ];

            rows.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'keyboard-row';
                
                row.forEach(key => {
                    const button = document.createElement('button');
                    button.textContent = key === 'BACKSPACE' ? '⌫' : key;
                    button.className = 'key';
                    if (key === 'ENTER' || key === 'BACKSPACE') {
                        button.classList.add('wide');
                    }
                    button.dataset.key = key;
                    button.addEventListener('click', () => handleKeyPress(key));
                    rowEl.appendChild(button);
                });
                
                keyboard.appendChild(rowEl);
            });
        }

        function handleKeyPress(key) {
            if (gameState.isGameOver) return;

            if (key === 'ENTER') {
                submitRow();
            } else if (key === 'BACKSPACE' || key === 'BACK') {
                deleteLetter();
            } else if (/^[A-ZÇ]$/i.test(key)) {
                addLetter(key.toUpperCase());
            }
        }

        function addLetter(letter) {
            if (gameState.currentCol < CONFIG.COLS && gameState.currentRow < CONFIG.ROWS) {
                gameState.boardState[gameState.currentRow][gameState.currentCol] = letter;
                const cell = document.getElementById(`cell-${gameState.currentRow}-${gameState.currentCol}`);
                cell.textContent = letter;
                gameState.currentCol++;
                highlightCurrentCell();
            }
        }

        function deleteLetter() {
            if (gameState.currentCol > 0) {
                gameState.currentCol--;
                gameState.boardState[gameState.currentRow][gameState.currentCol] = '';
                const cell = document.getElementById(`cell-${gameState.currentRow}-${gameState.currentCol}`);
                cell.textContent = '';
                highlightCurrentCell();
            }
        }

        function highlightCurrentCell() {
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
            if (gameState.currentRow < CONFIG.ROWS && gameState.currentCol < CONFIG.COLS) {
                const cell = document.getElementById(`cell-${gameState.currentRow}-${gameState.currentCol}`);
                if (cell) cell.classList.add('active');
            }
        }

        function submitRow() {
            if (gameState.currentCol < CONFIG.COLS) {
                showMessage("Palavra incompleta!");
                return;
            }

            const row = gameState.currentRow;
            const guess = gameState.boardState[row].join('');
            const target = gameState.secretWord;

            let targetLetters = target.split('');
            let rowStatuses = Array(CONFIG.COLS).fill('absent');

            // Primeiro passo: verificar acertos exatos (verdes)
            for (let i = 0; i < CONFIG.COLS; i++) {
                if (guess[i] === target[i]) {
                    rowStatuses[i] = 'correct';
                    targetLetters[i] = null; 
                }
            }

            // Segundo passo: verificar letras presentes (amarelas)
            for (let i = 0; i < CONFIG.COLS; i++) {
                if (rowStatuses[i] === 'correct') continue;
                
                const idx = targetLetters.indexOf(guess[i]);
                if (idx !== -1) {
                    rowStatuses[i] = 'present';
                    targetLetters[idx] = null;
                }
            }

            // Aplicar animações visuais na linha e no teclado
            for (let i = 0; i < CONFIG.COLS; i++) {
                const cell = document.getElementById(`cell-${row}-${i}`);
                const status = rowStatuses[i];
                cell.classList.add(status);
                
                // Atualizar teclado de forma incremental
                const keyBtn = document.querySelector(`.key[data-key="${guess[i]}"]`);
                if (keyBtn) {
                    if (status === 'correct') {
                        keyBtn.className = 'key correct';
                    } else if (status === 'present' && !keyBtn.classList.contains('correct')) {
                        keyBtn.className = 'key present';
                    } else if (status === 'absent' && !keyBtn.classList.contains('correct') && !keyBtn.classList.contains('present')) {
                        keyBtn.className = 'key absent';
                    }
                }
            }

            // Sistema de Pontuação e Linhas Eliminadas
            gameState.lines++;
            gameState.score += 2500; // Pontos base por tentativa aceita

            if (guess === target) {
                gameState.score += 10000; // Bônus de acerto
                showMessage("Sensacional! +10k Pontos");
                endTurn(true);
                return;
            }

            gameState.currentRow++;
            gameState.currentCol = 0;

            if (gameState.currentRow >= CONFIG.ROWS) {
                showMessage(`Fim da Linha! Palavra: ${target}`);
                endTurn(false);
            } else {
                highlightCurrentCell();
                updateProgressAndLevels();
            }
        }

        function endTurn(isWin) {
            updateProgressAndLevels();
            setTimeout(() => {
                // Prepara próxima rodada mantendo progresso global
                gameState.currentRow = 0;
                gameState.currentCol = 0;
                gameState.secretWord = WORD_POOL[Math.floor(Math.random() * WORD_POOL.length)];
                buildBoard();
                buildKeyboard();
            }, 2000);
        }

        function updateProgressAndLevels() {
            let targetLevel = 1;
            
            // Avalia o nível atual baseado nos novos limites estabelecidos
            for (let i = 1; i < CONFIG.LEVELS.length; i++) {
                if (gameState.score >= CONFIG.LEVELS[i].score || gameState.lines >= CONFIG.LEVELS[i].lines) {
                    targetLevel = i + 1;
                }
            }

            if (targetLevel > gameState.currentLevel) {
                gameState.currentLevel = targetLevel;
                showMessage(`Subiu de Nível! Patamar: ${CONFIG.LEVELS[targetLevel-1].name}`);
            }

            // Cálculo da barra de progresso para o próximo marco
            let progressPct = 0;
            if (gameState.currentLevel < CONFIG.LEVELS.length) {
                const currentMilestone = CONFIG.LEVELS[gameState.currentLevel - 1];
                const nextMilestone = CONFIG.LEVELS[gameState.currentLevel];
                
                const scoreDiff = nextMilestone.score - currentMilestone.score;
                const scoreProgress = scoreDiff > 0 ? ((gameState.score - currentMilestone.score) / scoreDiff) * 100 : 0;
                
                const linesDiff = nextMilestone.lines - currentMilestone.lines;
                const linesProgress = linesDiff > 0 ? ((gameState.lines - currentMilestone.lines) / linesDiff) * 100 : 0;

                // Usa o maior avanço entre pontos ou linhas para renderizar a barra
                progressPct = Math.min(100, Math.max(scoreProgress, linesProgress));
            } else {
                progressPct = 100; // Nível Máximo atingido
            }

            document.getElementById('level-progress-fill').style.width = `${progressPct}%`;
            updateUI();
        }

        function updateUI() {
            document.getElementById('score-val').textContent = gameState.score.toLocaleString('pt-BR');
            document.getElementById('lines-val').textContent = gameState.lines;
            document.getElementById('level-val').textContent = gameState.currentLevel;
        }

        function showMessage(text) {
            const msg = document.getElementById('message-overlay');
            msg.textContent = text;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 2500);
        }

        // Captura de eventos via teclado físico
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleKeyPress('ENTER');
            else if (e.key === 'Backspace') handleKeyPress('BACKSPACE');
            else handleKeyPress(e.key.toUpperCase());
        });

        // Inicializa o ciclo do jogo
        initGame();
    </script>
</body>
</html>
