<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedrun Panel</title>
    <style>
        :root {
            --bg-color: #fff5f6;
            --panel-bg: #fff0f2;
            --border-color: #ffd2d7;
            --text-dark: #5c0616;
            --text-muted: #a34756;
            --text-time: #2b0007;
            --btn-bg: #ffe0e4;
            --btn-hover: #ffcbd3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Container Principal */
        .panel-container {
            width: 200px;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .section-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0 0 8px 0;
        }

        .main-timer {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-time);
            font-family: monospace;
            margin-bottom: 4px;
        }

        /* --- O BOTÃO SOLICITADO --- */
        .filter-toggle-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-dark);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            outline: none;
        }

        .filter-toggle-btn:hover {
            background-color: var(--btn-hover);
        }

        /* Grid de Metas e Recordes */
        .splits-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .split-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            font-size: 12px;
        }

        .target-pts {
            font-weight: 800;
            color: var(--text-dark);
        }

        .current-split-time {
            font-family: monospace;
            color: var(--text-dark);
            font-weight: bold;
            text-align: right;
        }

        .pb-row {
            grid-column: 1 / span 2;
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .pb-time {
            font-family: monospace;
            font-weight: bold;
        }

        /* Divisor Tracejado */
        .divider {
            width: 100%;
            border-top: 1px dashed var(--border-color);
            margin: 8px 0;
        }

        /* Sub-containers (Próximo, Pontos, Linhas) */
        .sub-box {
            width: 100%;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        .sub-box:last-child {
            margin-bottom: 0;
        }

        .sub-box .value {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-time);
            margin-top: 4px;
        }

        /* Bloco de Peça (Tetris) */
        .next-piece-preview {
            width: 60px;
            height: 45px;
            display: grid;
            grid-template-columns: repeat(3, 15px);
            grid-template-rows: repeat(2, 15px);
            gap: 2px;
            justify-content: center;
            align-content: center;
            margin-top: 6px;
        }

        .block {
            background-color: #a085ff;
            border-radius: 3px;
        }
        .empty { visibility: hidden; }
    </style>
</head>
<body>

<div class="panel-container">
    <div class="section-title">Speedrun</div>
    <div class="divider"></div>
    
    <div class="main-timer">00:09.8</div>

    <button class="filter-toggle-btn" id="filterBtn" onclick="toggleFilter()">⏱️ All Time</button>

    <div class="splits-container">
        <div class="split-row">
            <span class="target-pts">500 pts</span>
            <span class="current-split-time">-:-.-</span>
            <div class="pb-row">PB (Recorde): <span class="pb-time" id="pb-500">01:37.6</span></div>
        </div>
        
        <div class="split-row">
            <span class="target-pts">1000 pts</span>
            <span class="current-split-time">-:-.-</span>
            <div class="pb-row">PB (Recorde): <span class="pb-time" id="pb-1000">03:29.7</span></div>
        </div>

        <div class="split-row">
            <span class="target-pts">1500 pts</span>
            <span class="current-split-time">-:-.-</span>
            <div class="pb-row">PB (Recorde): <span class="pb-time" id="pb-1500">05:19.2</span></div>
        </div>

        <div class="split-row">
            <span class="target-pts">2000 pts</span>
            <span class="current-split-time">-:-.-</span>
            <div class="pb-row">PB (Recorde): <span class="pb-time" id="pb-2000">07:08.9</span></div>
        </div>
    </div>

    <div class="sub-box">
        <div class="section-title" style="font-size: 11px; margin: 0;">Próximo</div>
        <div class="next-piece-preview">
            <div class="empty"></div><div class="block"></div><div class="empty"></div>
            <div class="block"></div><div class="block"></div><div class="block"></div>
        </div>
    </div>

    <div class="sub-box">
        <div class="section-title" style="font-size: 11px; margin: 0;">Pontos</div>
        <div class="value">0</div>
    </div>

    <div class="sub-box">
        <div class="section-title" style="font-size: 11px; margin: 0;">Linhas</div>
        <div class="value">0</div>
    </div>
</div>

<script>
    // Banco de dados fake para os recordes
    const recordDatabase = {
        alltime: {
            500: "01:37.6",
            1000: "03:29.7",
            1500: "05:19.2",
            2000: "07:08.9"
        },
        weekly: {
            500: "01:45.2",
            1000: "03:42.0",
            1500: "05:35.1",
            2000: "07:22.4"
        },
        daily: {
            500: "01:59.0",
            1000: "04:10.5",
            1500: "06:02.3",
            2000: "08:15.1"
        }
    };

    // Estados possíveis do filtro
    const filters = ["alltime", "daily", "weekly"];
    let currentFilterIndex = 0;

    function toggleFilter() {
        // Avança para o próximo filtro na array
        currentFilterIndex = (currentFilterIndex + 1) % filters.length;
        const currentFilter = filters[currentFilterIndex];
        
        const btn = document.getElementById("filterBtn");
        
        // Atualiza o texto do botão
        if (currentFilter === "alltime") btn.innerText = "⏱️ All Time";
        if (currentFilter === "daily") btn.innerText = "☀️ Daily";
        if (currentFilter === "weekly") btn.innerText = "📅 Weekly";

        // Atualiza os valores na tela com base no filtro selecionado
        document.getElementById("pb-500").innerText = recordDatabase[currentFilter][500];
        document.getElementById("pb-1000").innerText = recordDatabase[currentFilter][1000];
        document.getElementById("pb-1500").innerText = recordDatabase[currentFilter][1500];
        document.getElementById("pb-2000").innerText = recordDatabase[currentFilter][2000];
    }
</script>

</body>
</html>
